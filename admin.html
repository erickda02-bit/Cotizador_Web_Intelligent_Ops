<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Licencias PRO</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-xl font-extrabold text-amber-400">👑 Panel de Administración</h1>
            <p class="text-xs text-slate-400 mt-1">Generación y envío automático de licencias PRO</p>
        </div>

        <!-- Paso 1: Autenticación de Admin -->
        <div id="seccionLoginAdmin" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Correo de Administrador</label>
                <input type="email" id="adminEmailInput" placeholder="tu-correo@admin.com" class="w-full bg-slate-800 border border-slate-700 text-white p-3 text-sm rounded-xl outline-none focus:border-amber-400 transition">
            </div>
            <button onclick="verificarAccesoAdmin()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold py-3 rounded-xl transition text-sm shadow">
                🔓 Entrar al Panel
            </button>
        </div>

        <!-- Paso 2: Panel Oculto hasta que ingreses tu correo -->
        <div id="seccionPanelAdmin" class="hidden space-y-4">
            <div class="bg-emerald-950/40 border border-emerald-500/30 p-3 rounded-xl text-xs text-emerald-300 flex justify-between items-center">
                <span>Sesión Admin Activa</span>
                <button onclick="cerrarSesionAdmin()" class="underline text-slate-400 hover:text-white">Cerrar sesión</button>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Correo del Cliente</label>
                <input type="email" id="emailNuevoCliente" placeholder="cliente@empresa.com" class="w-full bg-slate-800 border border-slate-700 text-white p-3 text-sm rounded-xl outline-none focus:border-amber-400 transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">WhatsApp del Cliente (con código de país)</label>
                <input type="text" id="whatsappNuevoCliente" placeholder="ej. 521XXXXXXXXXX" class="w-full bg-slate-800 border border-slate-700 text-white p-3 text-sm rounded-xl outline-none focus:border-amber-400 transition">
            </div>

            <button onclick="generarRegistrarYEnviarWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-3 rounded-xl transition text-sm shadow flex items-center justify-center gap-2">
                🚀 Registrar en Supabase y Enviar WhatsApp
            </button>
            
            <div id="resultadoLicenciaNueva" class="text-xs text-center"></div>
        </div>
        
        <div class="mt-6 text-center">
            <a href="index.html" class="text-xs text-slate-500 hover:text-slate-300 underline">← Volver al Inicio</a>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE SUPABASE (Asegúrate de poner tus credenciales reales)
        const SUPABASE_URL = 'https://jdjwuptjnkcpsidncckz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impkand1cHRqbmtjcHNpZG5jY2t6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NzkzNDksImV4cCI6MjEwNDQ1NTM0OX0.0zrOsp7qbbpcSfCvo9zCSLe5lgOXdv2UX22xrmVCvjs';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // CORREO DEL ADMINISTRADOR OFICIAL
        const CORREO_ADMIN_OFICIAL = "erickda02@gmail.com";

        function verificarAccesoAdmin() {
            const emailIngresado = document.getElementById('adminEmailInput').value.trim();
            if(emailIngresado.toLowerCase() === CORREO_ADMIN_OFICIAL.toLowerCase()) {
                localStorage.setItem('admin_session', emailIngresado);
                mostrarPanelAdmin();
            } else {
                alert("Correo de administrador no válido.");
            }
        }

        function mostrarPanelAdmin() {
            const sesion = localStorage.getItem('admin_session');
            if(sesion && sesion.toLowerCase() === CORREO_ADMIN_OFICIAL.toLowerCase()) {
                document.getElementById('seccionLoginAdmin').classList.add('hidden');
                document.getElementById('seccionPanelAdmin').classList.remove('hidden');
            }
        }

        function cerrarSesionAdmin() {
            localStorage.removeItem('admin_session');
            document.getElementById('seccionLoginAdmin').classList.remove('hidden');
            document.getElementById('seccionPanelAdmin').classList.add('hidden');
        }

        async function generarRegistrarYEnviarWhatsApp() {
            const emailInput = document.getElementById('emailNuevoCliente');
            const waInput = document.getElementById('whatsappNuevoCliente');
            const resultadoDiv = document.getElementById('resultadoLicenciaNueva');
            
            const emailCliente = emailInput.value.trim();
            const telefonoCliente = waInput.value.trim().replace(/\D/g,'');

            if(!emailCliente || !emailCliente.includes('@')) {
                resultadoDiv.innerHTML = `<span class="text-red-400">⚠️ Ingresa un correo válido.</span>`;
                return;
            }
            if(!telefonoCliente || telefonoCliente.length < 10) {
                resultadoDiv.innerHTML = `<span class="text-red-400">⚠️ Ingresa un WhatsApp válido (con lada).</span>`;
                return;
            }

            // Generar código único PRO
            const randomNum1 = Math.floor(1000 + Math.random() * 9000);
            const randomNum2 = Math.floor(1000 + Math.random() * 9000);
            const codigoGenerado = `PRO-${randomNum1}-${randomNum2}`;

            resultadoDiv.innerHTML = `<span class="text-slate-400">Procesando licencia en Supabase...</span>`;

            // UPSERT: Si el correo ya existe, actualiza la licencia; si no, lo crea nuevo sin errores
            const { error } = await supabaseClient
                .from('usuarios_pro')
                .upsert(
                    [ { email_usuario: emailCliente, codigo_licencia: codigoGenerado } ],
                    { onConflict: 'email_usuario' }
                );

            if (error) {
                console.error("Error:", error);
                resultadoDiv.innerHTML = `<span class="text-red-400">Error técnico: ${error.message}</span>`;
            } else {
              // 1. Escribe el texto normal con emojis y saltos de línea reales (\n)
                const mensajeBase = `¡Hola! Tu pago ha sido confirmado con éxito. 🚀\n\nTu código de acceso exclusivo para la versión PRO es:\n*${codigoGenerado}*\n\nPuedes ingresar a tu plataforma en la nube y comenzar a cotizar. ¡Gracias!`;

// 2. Codifica todo el texto automáticamente para que WhatsApp lo lea perfecto
                const urlWhatsApp = `https://wa.me/${telefonoCliente}?text=${encodeURIComponent(mensajeBase)}`;

// 3. Abrir WhatsApp
                window.open(urlWhatsApp, '_blank');
                
                resultadoDiv.innerHTML = `<span class="text-emerald-400 font-bold">¡Licencia procesada y WhatsApp abierto con éxito! 🎉</span>`;
                emailInput.value = '';
                waInput.value = '';
            }
        }

        // Revisar si ya había sesión activa al cargar
        window.addEventListener('DOMContentLoaded', () => {
            mostrarPanelAdmin();
        });
    </script>
</body>
</html>
